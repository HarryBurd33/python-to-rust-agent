name: Isolated FASTA evidence
on:
  push:
    branches: [codex/fasta-isolated-2026-11-19]
    paths: [.github/workflows/fasta-isolated.yml]
permissions:
  contents: read
concurrency:
  group: isolated-fasta-2026-11-19
  cancel-in-progress: false
jobs:
  benchmark:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: 1.99.1
      CARGO_NET_OFFLINE: 'true'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.15.0'
      - name: Install Rust 1.99.1 (wrapper selects direct compiler through preserved PATH)
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Settle disposable Linux VM after toolchain installation
        run: sleep 90
      - name: Qualify bound RSS adapter, affinity, compiler and quietness before fixed benchmark once
        run: python3 benchmarks/fasta/run_linux.py --destination "$RUNNER_TEMP/fasta-evidence"
      - name: Preserve complete evidence even on failure
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: fasta-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/fasta-evidence
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
